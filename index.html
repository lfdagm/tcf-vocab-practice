<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pratique du vocabulaire — Français TCF</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Arial, sans-serif; max-width: 920px; margin: 0 auto; padding: 20px; background: #f5f5f7; color: #222; }
  h1 { font-size: 22px; text-align: center; }
  .layout { display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; }
  .main { flex:2; min-width:300px; }
  .side { flex:1; min-width:220px; background:#fff; border-radius:16px; padding:18px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .tag { display:inline-block; font-size: 13px; color:#888; background:#eee; padding:3px 10px; border-radius:20px; margin-bottom:14px; }
  .def { font-size: 21px; line-height:1.4; margin-bottom: 8px; }
  .es { font-size: 15px; color:#999; font-style:italic; margin-bottom:18px; display:none; }
  input { width:100%; font-size:22px; padding:12px; border:2px solid #ccc; border-radius:10px; }
  .row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  button { flex:1; min-width:110px; font-size:16px; padding:12px; border:none; border-radius:10px; background:#1a73e8; color:#fff; cursor:pointer; }
  button.sec { background:#888; font-size:15px; padding:10px; }
  button.verif { width:100%; flex:1 0 100%; font-size:19px; padding:16px; font-weight:bold; background:#1a73e8; box-shadow:0 2px 8px rgba(26,115,232,.35); }
  .answer.ok2 { color:#1a8a3a; }   /* respuesta correcta en verde */
  .feedback { margin-top:16px; font-size:18px; font-weight:bold; min-height:26px; }
  .ok { color:#1a8a3a; }
  .no { color:#d33; }
  .answer { margin-top:8px; font-size:20px; color:#1a5; font-weight:bold; }
  .ex { margin-top:10px; font-style:italic; color:#666; font-size:16px; display:none; }
  .score { text-align:center; font-size:15px; color:#666; margin-top:18px; }
  select { font-size:15px; padding:8px; border-radius:8px; margin-top:10px; width:100%; }
  .rewrite { margin-top:18px; padding:14px; background:#fff7e6; border:1px dashed #e0a800; border-radius:12px; display:none; }
  .rewrite label { font-size:14px; color:#a07400; display:block; margin-bottom:8px; }
  .rewrite .done { color:#1a8a3a; font-weight:bold; margin-top:8px; min-height:20px; }
  .side h3 { font-size:16px; margin:0 0 10px; }
  .errlist { list-style:none; padding:0; margin:0; max-height:60vh; overflow:auto; }
  .errlist li { padding:8px 10px; border-bottom:1px solid #eee; font-size:15px; }
  .errlist .w { font-weight:bold; color:#d33; }
  .errlist .small { font-size:12px; color:#999; }
  .clearbtn { background:#bbb; margin-top:10px; }
  /* Tabs */
  .tabs { display:flex; gap:8px; justify-content:center; margin-bottom:16px; }
  .tabs button { flex:0 0 auto; min-width:0; background:#e3e3e8; color:#444; padding:10px 20px; font-size:15px; }
  .tabs button.active { background:#1a73e8; color:#fff; }
  .hidden { display:none !important; }
  /* Flashcards */
  .speak { background:none; border:none; cursor:pointer; font-size:22px; padding:4px 8px; flex:0 0 auto; min-width:0; color:#1a73e8; }
  .flash { background:#fff; border-radius:16px; padding:30px 24px; box-shadow:0 2px 12px rgba(0,0,0,.08); min-height:260px; display:flex; flex-direction:column; justify-content:center; }
  .flash .ftag { font-size:13px; color:#888; background:#eee; padding:3px 10px; border-radius:20px; align-self:center; margin-bottom:18px; }
  .flash .word { font-size:30px; font-weight:bold; text-align:center; display:flex; align-items:center; justify-content:center; gap:6px; }
  .flash .back { margin-top:18px; border-top:1px solid #eee; padding-top:16px; }
  .flash .es2 { font-size:17px; color:#1a73e8; font-style:italic; margin-bottom:12px; }
  .flash .def2 { font-size:18px; line-height:1.45; margin-bottom:12px; }
  .flash .ex2 { font-size:16px; font-style:italic; color:#666; }
  .fliphint { text-align:center; font-size:13px; color:#aaa; margin-top:14px; }
  .fnav { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .fcount { text-align:center; font-size:14px; color:#666; margin-top:14px; }
  .voicebar { display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:14px; flex-wrap:wrap; }
  .voicebar label { font-size:13px; color:#888; }
  .voicebar select { width:auto; min-width:160px; max-width:100%; margin-top:0; }
  .showes { background:#eef3ff; color:#1a73e8; border:1px solid #cfe0ff; font-size:14px; padding:8px 14px; border-radius:8px; cursor:pointer; flex:0 0 auto; min-width:0; }
</style>
</head>
<body>
<h1>🇫🇷 Pratique du vocabulaire</h1>

<div class="tabs">
  <button id="tabFlash" class="active" onclick="showTab('flash')">🃏 Flashcards</button>
  <button id="tabEcrit" onclick="showTab('ecrit')">✍️ Écriture</button>
</div>

<select id="theme">
  <option value="">Tous les thèmes</option>
</select>

<div id="viewEcrit" class="hidden">
<div class="layout">
  <div class="main">
    <div class="card">
      <span class="tag" id="tag"></span>
      <div class="def" id="def">—</div>
      <div class="es" id="es"></div>
      <input id="inp" type="text" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" placeholder="Écris le mot en français...">
      <div class="row">
        <button class="verif" onclick="check()">Vérifier</button>
      </div>
      <div class="row">
        <button class="sec" onclick="prevQ()">‹ Précédent</button>
        <button class="sec" onclick="showHint()">Indice (espagnol)</button>
        <button class="sec" onclick="reveal()">Voir la réponse</button>
        <button class="sec" onclick="next()">Suivant ›</button>
      </div>
      <div class="feedback" id="fb"></div>
      <div class="answer" id="ans">
        <span id="ansText"></span>
        <button class="speak hidden" id="espeak" onclick="speakWord(cur && cur.f)" title="Écouter">🔊</button>
      </div>
      <div class="ex" id="ex"></div>

      <div class="rewrite" id="rewrite">
        <label>✍️ Réécris le mot correct pour le mémoriser :</label>
        <input id="rwinp" type="text" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" placeholder="Réécris ici...">
        <div class="done" id="rwdone"></div>
      </div>
    </div>
    <div class="score" id="score">Score : 0 / 0</div>
  </div>

  <div class="side">
    <h3>❌ Mots à revoir (<span id="errcount">0</span>)</h3>
    <ul class="errlist" id="errlist"></ul>
    <button class="clearbtn" onclick="clearErrors()">Vider la liste</button>
  </div>
</div>
</div>

<div id="viewFlash">
  <div class="main">
    <div class="voicebar">
      <label for="voiceSel">🗟️ Voix :</label>
      <select id="voiceSel" onchange="onVoiceChange()"></select>
      <button class="showes" id="randomBtn" onclick="toggleRandom()">🔀 Aléatoire : OFF</button>
    </div>
    <div class="flash" id="flash">
      <span class="ftag" id="ftag"></span>
      <div class="word">
        <span id="fword">—</span>
        <button class="speak" id="fspeak" onclick="speak();" title="Écouter">🔊</button>
      </div>
      <div class="back">
        <div class="def2" id="fdef"></div>
        <div class="ex2" id="fex"></div>
        <button class="showes" id="showesBtn" onclick="toggleEs();">🇪🇸 Voir la traduction</button>
        <div class="es2 hidden" id="fes"></div>
      </div>
    </div>
    <div class="fnav">
      <button class="sec" onclick="fprev()">‹ Précédent</button>
      <button onclick="fnext()">Suivant ›</button>
    </div>
    <div class="fcount" id="fcount"></div>
    <div class="fcount" style="font-size:12px; color:#aaa; margin-top:6px;">
      ⌨️ Espace / → : suivante · Suppr / ← : précédente · P / ↑ : écouter · T : traduction
    </div>
  </div>
</div>

function pickCard(){
  // 30% de probabilidad de repreguntar una fallada (si hay en cola)
  if(queue.length && Math.random() < 0.35){
    return queue.shift();

  return pool[Math.floor(Math.random()*pool.length)];
}

  document.getElementById('tag').textContent = cur.t;
  document.getElementById('def').textContent = cur.d;
  document.getElementById('es').textContent = '🇪🇸 ' + cur.es;
  document.getElementById('es').style.display = 'none';
  document.getElementById('inp').value = '';
  document.getElementById('fb').textContent = '';
  document.getElementById('ansText').textContent = '';
  document.getElementById('ans').classList.remove('ok2');
  document.getElementById('espeak').classList.add('hidden');   // ocultar audio hasta corregir/revelar
  document.getElementById('ex').style.display = 'none';
  document.getElementById('ex').textContent = cur.ex;
  document.getElementById('rewrite').style.display = 'none';
  document.getElementById('rwinp').value = '';
  document.getElementById('rwdone').textContent = '';
  document.getElementById('inp').focus();
}

function next(){
  // si veníamos navegando hacia atrás, re-avanzar por el historial
  if(hPos < history.length - 1){
    hPos++;
    showCard(history[hPos]);
    return;
  }
  // carta nueva
  const c = pickCard();
  history.push(c);
  if(history.length > 200) history.shift();   // límite de memoria
  hPos = history.length - 1;
  showCard(c);
}

function prevQ(){
  if(hPos > 0){ hPos--; showCard(history[hPos]); }
}

function showHint(){ document.getElementById('es').style.display='block'; }

function reveal(){
  if(answered) return;            // si ya respondiste, no hace nada
  document.getElementById('es').style.display='block';   // muestra también el español
  document.getElementById('ans').classList.remove('ok2');
  document.getElementById('ansText').textContent = '→ ' + cur.f;
  document.getElementById('espeak').classList.remove('hidden');  // mostrar botón audio 🔊
  document.getElementById('ex').style.display='block';   // muestra el ejemplo
  document.getElementById('fb').textContent = '';
  // no cuenta como respuesta ni penaliza el score; únicamente revela
}

function check(){
  if(answered) { next(); return; }
  const val = norm(document.getElementById('inp').value);
  if(!val) return;
  total++; answered = true;
  const fb = document.getElementById('fb');
  const ansEl = document.getElementById('ans');
  if(strip(val) === strip(cur.f)){
    correct++; fb.textContent = '✅ Correct !'; fb.className='feedback ok';
    // mostrar siempre la palabra correcta en verde, con audio al lado
    ansEl.classList.add('ok2');
    let txt = cur.f;
    if(norm(val) !== norm(cur.f)) txt += '  (orthographe exacte)';
    document.getElementById('ansText').textContent = txt;
  } else {
    fb.textContent = '❌ Pas tout à fait.'; fb.className='feedback no';
    ansEl.classList.remove('ok2');
    document.getElementById('ansText').textContent = '→ ' + cur.f;
    addError(cur);
    queue.push(cur);   // vuelve a la cola para repreguntar
    // mostrar campo de reescritura
    const rw = document.getElementById('rewrite');
    rw.style.display='block';
  }
  document.getElementById('ex').style.display='block';
  document.getElementById('espeak').classList.remove('hidden');  // mostrar botón audio 🔊 tras corregir
  document.getElementById('score').textContent = 'Score : ' + correct + ' / ' + total;
}

// reescritura: confirma cuando escribe bien la palabra
document.getElementById('rwinp').addEventListener('input', function(){
  if(strip(this.value) === strip(cur.f) && norm(this.value)===norm(cur.f)){
    document.getElementById('rwdone').textContent = '👍 Bien écrit ! Appuie sur « Suivant ».';
  } else {
    document.getElementById('rwdone').textContent = '';
  }
});

function addError(c){
  if(!errors[c.f]) errors[c.f] = {d:c.d, es:c.es, t:c.t, count:0};
  errors[c.f].count++;
  renderErrors();
}
function renderErrors(){
  const ul = document.getElementById('errlist');
  ul.innerHTML='';
  const keys = Object.keys(errors);
  document.getElementById('errcount').textContent = keys.length;
  keys.forEach(w => {
    const e = errors[w];
    const li = document.createElement('li');
    li.innerHTML = '<span class="w">'+w+'</span> — <span class="small">'+e.es+' · '+e.t+(e.count>1?(' · ×'+e.count):'')+'</span>';
    ul.appendChild(li);
  });
}
function clearErrors(){ errors={}; renderErrors(); }

document.getElementById('inp').addEventListener('keydown', e => { if(e.key==='Enter') check(); });
next();

/* ===== Tabs ===== */
function showTab(which){
  const ec = which==='ecrit';
  document.getElementById('viewEcrit').classList.toggle('hidden', !ec);
  document.getElementById('viewFlash').classList.toggle('hidden', ec);
  document.getElementById('tabEcrit').classList.toggle('active', ec);
  document.getElementById('tabFlash').classList.toggle('active', !ec);
}

/* ===== Flashcards ===== */
// Usa el mismo pool que el modo Écriture (respeta el filtro de thème),
// pero mantiene su propio "orden" (secuencial o aleatorio).
let fIndex = 0, fRandom = false, fOrder = [];

function buildOrder(){
  fOrder = pool.map((_, i) => i);   // índices 0..n-1 en orden
  if(fRandom){
    for(let i = fOrder.length - 1; i > 0; i--){   // Fisher-Yates shuffle
      const j = Math.floor(Math.random() * (i + 1));
      [fOrder[i], fOrder[j]] = [fOrder[j], fOrder[i]];
    }
  }
  fIndex = 0;
}

function fRender(){
  if(!pool.length){ return; }
  if(!fOrder.length || fOrder.length !== pool.length) buildOrder();
  if(fIndex >= fOrder.length) fIndex = 0;
  if(fIndex < 0) fIndex = fOrder.length - 1;
  const c = pool[fOrder[fIndex]];
  document.getElementById('ftag').textContent = c.t;
  document.getElementById('fword').textContent = c.f;
  document.getElementById('fes').textContent = '🇪🇸 ' + c.es;
  document.getElementById('fdef').textContent = c.d;
  document.getElementById('fex').textContent = '“' + c.ex + '”';
  // la traducción al español arranca oculta en cada tarjeta
  document.getElementById('fes').classList.add('hidden');
  document.getElementById('showesBtn').textContent = '🇪🇸 Voir la traduction';
  document.getElementById('fcount').textContent = (fIndex+1) + ' / ' + fOrder.length;
}
function toggleEs(){
  const es = document.getElementById('fes');
  const hidden = es.classList.toggle('hidden');
  document.getElementById('showesBtn').textContent = hidden ? '🇪🇸 Voir la traduction' : '🇪🇸 Masquer la traduction';
}
function toggleRandom(){
  fRandom = !fRandom;
  document.getElementById('randomBtn').textContent = '🔀 Aléatoire : ' + (fRandom ? 'ON' : 'OFF');
  buildOrder();
  fRender();
}
function fnext(){ fIndex++; fRender(); }
function fprev(){ fIndex--; fRender(); }

// cuando cambia el thème, reconstruimos el orden de flashcards
const _selOnchange = sel.onchange;
sel.onchange = () => { _selOnchange(); buildOrder(); fRender(); };

/* ===== Audio (pronunciación FR via SpeechSynthesis) ===== */
let frVoices = [], selectedVoice = null;
const VOICE_KEY = 'pv_voice_fr';

function loadVoices(){
  if(!window.speechSynthesis) return;
  const all = window.speechSynthesis.getVoices();
  // Priorizar voces francesas; si no hay, mostrar todas como fallback
  frVoices = all.filter(v => /^fr/i.test(v.lang));
  const list = frVoices.length ? frVoices : all;
  const selEl = document.getElementById('voiceSel');
  if(!selEl) return;
  selEl.innerHTML = '';
  if(!list.length){
    const o = document.createElement('option');
    o.textContent = 'Voix par défaut du système';
    o.value = '';
    selEl.appendChild(o);
    return;
  }
  const saved = localStorage.getItem(VOICE_KEY);
  list.forEach(v => {
    const o = document.createElement('option');
    o.value = v.name;
    o.textContent = v.name + ' (' + v.lang + ')';
    selEl.appendChild(o);
  });
  // restaurar selección guardada o tomar la primera fr-FR
  let chosen = list.find(v => v.name === saved) ||
               list.find(v => /fr[-_]FR/i.test(v.lang)) || list[0];
  selEl.value = chosen.name;
  selectedVoice = chosen;
}
function onVoiceChange(){
  const name = document.getElementById('voiceSel').value;
  const all = window.speechSynthesis.getVoices();
  selectedVoice = all.find(v => v.name === name) || null;
  if(selectedVoice) localStorage.setItem(VOICE_KEY, selectedVoice.name);
  speak(); // previsualizar la voz elegida
}
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
// pronuncia cualquier texto en francés con la voz seleccionada
function speakWord(text){
  if(!text) return;
  if(!window.speechSynthesis){ alert("Ton navigateur ne supporte pas la synthèse vocale."); return; }
  if(!selectedVoice){ loadVoices(); }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = (selectedVoice && selectedVoice.lang) || 'fr-FR';
  if(selectedVoice) u.voice = selectedVoice;
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}
// usado por las flashcards (lee la palabra de la carta actual)
function speak(){
  const c = pool[fOrder[fIndex]];
  if(c) speakWord(c.f);
}

/* ===== Accesibilité clavier (mode Flashcards) ===== */
// Espace = suivant · Delete/Backspace = précédent · P ou ↑ = écouter · →/← aussi
document.addEventListener('keydown', e => {
  // solo actuar en la pestaña Flashcards
  if(document.getElementById('viewFlash').classList.contains('hidden')) return;
  // no interferir si se está escribiendo en un campo
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  const k = e.key;
  if(k === ' ' || k === 'Spacebar' || k === 'ArrowRight'){
    e.preventDefault(); fnext();
  } else if(k === 'Backspace' || k === 'Delete' || k === 'ArrowLeft'){
    e.preventDefault(); fprev();
  } else if(k === 'p' || k === 'P' || k === 'ArrowUp'){
    e.preventDefault(); speak();
  } else if(k === 't' || k === 'T'){
    e.preventDefault(); toggleEs();   // T = traduction (bonus)
  }
});

// Inicializar flashcards al cargar (es la pestaña por defecto)
fRender();
</script>
